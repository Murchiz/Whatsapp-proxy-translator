name: CI & Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release/Binary version tag (e.g. v1.0.0). If empty, auto-detected from tag or run number.'
        required: false
        type: string
        default: ''
      asio_version:
        description: 'Asio version tag'
        required: false
        type: string
        default: 'asio-1-38-2'
      create_release:
        description: 'Publish a GitHub Release'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      asio_version: ${{ steps.version_step.outputs.asio_version }}
      should_release: ${{ steps.version_step.outputs.should_release }}
    steps:
      - id: version_step
        run: |
          # 1. Resolve application / release version
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v1.0.0-dev.${{ github.run_number }}"
          fi

          if [[ "$VER" != v* ]]; then
            VER="v$VER"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

          # 2. Resolve Asio library version
          ASIO_VER="${{ inputs.asio_version }}"
          if [ -z "$ASIO_VER" ]; then
            ASIO_VER="asio-1-38-2"
          fi
          echo "asio_version=$ASIO_VER" >> $GITHUB_OUTPUT

          # 3. Determine if release should be published
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "${{ inputs.create_release }}" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

          echo "=========================================="
          echo "Resolved Application Version: $VER"
          echo "Resolved Asio Version:        $ASIO_VER"
          echo "=========================================="

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: translator-${{ needs.determine-version.outputs.version }}-linux-x64
            archive_name: translator-${{ needs.determine-version.outputs.version }}-linux-x64.tar.gz

          - os: windows-latest
            artifact_name: translator-${{ needs.determine-version.outputs.version }}-windows-x64
            archive_name: translator-${{ needs.determine-version.outputs.version }}-windows-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev openssl

      - name: Detect OpenSSL Path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\OpenSSL-Win64") {
            Write-Host "Found OpenSSL at C:\Program Files\OpenSSL-Win64"
            echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\Program Files\OpenSSL") {
            Write-Host "Found OpenSSL at C:\Program Files\OpenSSL"
            echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
          }

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DTRANSLATOR_VERSION="${{ needs.determine-version.outputs.version }}" \
            -DASIO_VERSION="${{ needs.determine-version.outputs.asio_version }}"

      - name: Build Project
        run: |
          cmake --build build --config Release -j

      - name: Run Tests (CTest)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Stage & Verify Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          if [ -f build/translator ]; then
            cp build/translator dist/
          elif [ -f build/Release/translator ]; then
            cp build/Release/translator dist/
          fi
          chmod +x dist/translator
          cp README.md LICENSE dist/
          echo "=== Testing staged binary ==="
          ./dist/translator --version
          ./dist/translator --help
          ./dist/translator --status
          tar -czvf ${{ matrix.archive_name }} -C dist .

      - name: Stage & Verify Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path build/Release/translator.exe) {
            Copy-Item build/Release/translator.exe dist/
          } elseif (Test-Path build/translator.exe) {
            Copy-Item build/translator.exe dist/
          }
          Copy-Item README.md, LICENSE dist/
          Write-Host "=== Testing staged binary ==="
          & ./dist/translator.exe --version
          & ./dist/translator.exe --help
          & ./dist/translator.exe --status
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 14

  release:
    name: Publish Release (${{ needs.determine-version.outputs.version }})
    needs: [determine-version, build-and-test]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: Release ${{ needs.determine-version.outputs.version }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
